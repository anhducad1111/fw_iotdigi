<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit Config</title>

	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="bootstrap.min.css" type="text/css">

	<link href="firework.css?v=v1" rel="stylesheet">

	<script type="text/javascript" src="common.js?v=v1"></script>
	<script type="text/javascript" src="jquery-3.6.0.min.js?v=v1"></script>
	<script type="text/javascript" src="firework.js?v=v1"></script>

	<style>
		#reboot_button {
			cursor: pointer;
			text-decoration: underline;
			color: #fff;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<div class="container-fluid py-4">
		<div class="card shadow-sm">
			<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
				<h4 class="mb-0">Configuration - "Config.ini" Editor</h4>
			</div>

			<div class="card-body">
				<div class="mb-3">
					<textarea class="form-control font-monospace" id="inputTextToSave" rows="25"
						style="font-size: 0.9rem;"></textarea>
				</div>

				<div class="d-grid gap-2">
					<button class="btn btn-success btn-lg" onclick="saveTextAsFile()">
						<i class="bi bi-save"></i> Save Config
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap Bundle JS -->
	<script src="bootstrap.bundle.min.js"></script>

	<script type="text/javascript" src="readconfigparam.js?v=v1"></script>
	<script type="text/javascript" src="readconfigcommon.js?v=v1"></script>

	<script type="text/javascript">
		var canvas = document.getElementById('canvas'),
			domainname = getDomainname();


		function LoadConfigNeu() {
			domainname = getDomainname();
			loadConfig(domainname);
			document.getElementById("inputTextToSave").value = getConfig();
		}

		function saveTextAsFile() {
			FileDeleteOnServer("/config/config.ini", domainname);
			var textToSave = document.getElementById("inputTextToSave").value;
			FileSendContent(textToSave, "/config/config.ini", domainname);

			firework.launch('Configuration saved. It will get applied after the next reboot!<br><br>\n<a id="reboot_button" onclick="doReboot()">reboot now</a>', 'success', 5000);
		}

		function doReboot() {
			var stringota = "/reboot";
			window.location = stringota;
			window.location.href = stringota;
			window.location.assign(stringota);
			window.location.replace(stringota);
		}

		LoadConfigNeu();

	</script>

</body>

</html>
