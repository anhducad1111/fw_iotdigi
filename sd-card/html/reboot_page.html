<!DOCTYPE html>
<html lang="en" xml:lang="en"> 
<head>
<title>Reboot</title>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css" type="text/css">
    
    <!-- Custom Edit Styles -->
    <link rel="stylesheet" href="edit_style.css" type="text/css">

    <script type="text/javascript" src="common.js?v=v1"></script> 
</head>

<body>
    <div class="container-fluid py-3">
	
<h3>Do you really want to reboot now?</h3>

<table class="fixed" border="0">
	<tr>
		<td>
			<button class="button" id="reboot" type="button" onclick="doReboot()">Reboot</button>
		</td>
	</tr>
</table>

<script>
function doReboot() {
	var stringota = getDomainname() + "/reboot";
	window.location = stringota;
	window.location.href = stringota;
	window.location.assign(stringota);
	window.location.replace(stringota);
}
</script>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="bootstrap.bundle.min.js"></script>
</body>
</html>
