<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
    <title>Data Viewer</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css" type="text/css">

    <script type="text/javascript" src="common.js?v=v1"></script>
</head>

<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="mb-4">
            <h2 class="mb-1">Data Viewer</h2>
            <h5 class="text-muted">Today's latest data</h5>
        </div>

        <!-- Main Card -->
        <div class="card shadow-sm">
            <!-- Action Buttons Header -->
            <div class="card-header bg-light">
                <div class="btn-group flex-wrap" role="group" aria-label="Data actions">
                    <button class="btn btn-primary" onClick="reload();">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <button class="btn btn-outline-primary" onClick="window.open(getDomainname() + '/datafileact');">
                        <i class="bi bi-file-text"></i> Show Full File
                    </button>
                    <button class="btn btn-outline-primary"
                        onClick="window.location.href = getDomainname() + '/fileserver/log/data/'">
                        <i class="bi bi-folder"></i> Show Data Files
                    </button>
                    <button class="btn btn-outline-primary" onClick="window.location.href = 'graph.html?v=v1'">
                        <i class="bi bi-graph-up"></i> Show Graph
                    </button>
                </div>
            </div>

            <!-- Data Content -->
            <div class="card-body">
                <div id="data" class="font-monospace small"
                    style="white-space: pre-wrap; max-height: 600px; overflow-y: auto;">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3"><strong>Loading data file, please wait...</strong></p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons Footer -->
            <div class="card-footer bg-light">
                <div class="btn-group flex-wrap" role="group" aria-label="Data actions">
                    <button class="btn btn-primary" onClick="reload();">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <button class="btn btn-outline-primary" onClick="window.open(getDomainname() + '/datafileact');">
                        <i class="bi bi-file-text"></i> Show Full File
                    </button>
                    <button class="btn btn-outline-primary"
                        onClick="window.location.href = getDomainname() + '/fileserver/log/data/'">
                        <i class="bi bi-folder"></i> Show Data Files
                    </button>
                    <button class="btn btn-outline-primary" onClick="window.location.href = 'graph.html?v=v1'">
                        <i class="bi bi-graph-up"></i> Show Graph
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="bootstrap.bundle.min.js"></script>

    <script>
        function reload() {
            document.getElementById('data').innerHTML += '<div class="alert alert-info mt-2"><strong>Reloading...</strong></div>';
            window.scrollBy(0, document.body.scrollHeight);
            funcRequest(getDomainname() + '/data');
        }

        async function funcRequest(url) {
            await fetch(url)
                .then((res) => {
                    if (!res.ok) {
                        document.getElementById("data").innerHTML = '<div class="alert alert-danger"><strong>Error:</strong> HTTP error ' + res.status + '</div>';
                    }

                    return res.text();
                })
                .then((data) => {
                    document.getElementById('data').innerHTML = "<br>" + data.split("\n").join("\n<br>") + "&nbsp;";

                    window.scrollBy(0, document.body.scrollHeight);

                })
                .catch((err) => {
                    document.getElementById("data").innerHTML = '<div class="alert alert-danger"><strong>Error:</strong> ' + err + '</div>';
                });
        }

        funcRequest(getDomainname() + '/data');

    </script>
</body>

</html>
