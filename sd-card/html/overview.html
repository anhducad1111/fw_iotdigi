<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
	<title>Overview</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="bootstrap.min.css" type="text/css">

	<style>
		body {
			font-family: Arial, Helvetica, sans-serif;
			background-color: #f8f9fa;
		}

		.overview-table {
			width: 100%;
			min-width: 600px;
		}

		.section-header {
			background-color: #e9ecef;
			font-weight: bold;
			font-size: 18px;
		}

		.value-cell {
			font-size: 15px;
			vertical-align: middle;
		}

		.image-cell {
			vertical-align: top;
		}

		.roi-image {
			padding-left: 5px;
			padding-top: 0px;
			max-width: 100%;
			width: 100%;
			height: auto;
		}
	</style>

</head>

<body>
	<div class="container-fluid p-3">
		<div class="row g-3">
			<!-- Left Column - Values -->
			<div class="col-lg-6">
				<!-- Value Card -->
				<div class="card mb-3 shadow-sm">
					<div class="card-header section-header">
						Value
					</div>
					<div class="card-body value-cell">
						<div id="value"></div>
					</div>
				</div>

				<!-- Previous Value Card -->
				<div class="card mb-3 shadow-sm">
					<div class="card-header section-header">
						Previous Value
					</div>
					<div class="card-body value-cell">
						<div id="prevalue"></div>
					</div>
				</div>

				<!-- Raw Value Card -->
				<div class="card mb-3 shadow-sm">
					<div class="card-header section-header">
						Raw Value
					</div>
					<div class="card-body value-cell">
						<div id="raw"></div>
					</div>
				</div>

				<!-- Value Status Card -->
				<div class="card mb-3 shadow-sm">
					<div class="card-header section-header">
						Value Status
					</div>
					<div class="card-body value-cell">
						<div id="error"></div>
					</div>
				</div>

				<!-- Process State Card -->
				<div class="card mb-3 shadow-sm">
					<div class="card-header section-header">
						Process State
					</div>
					<div class="card-body value-cell">
						<div id="statusflow"></div>
					</div>
				</div>

				<!-- System Info Card -->
				<div class="card mb-3 shadow-sm">
					<div class="card-header section-header">
						System Info
					</div>
					<div class="card-body">
						<div id="sntp_date" class="mb-1"></div>
						<div id="timestamp" class="mb-1"></div>
						<div id="cputemp" class="mb-1"></div>
						<div id="rssi" class="mb-1"></div>
						<div>
							<span id="uptime"></span>
							<span id="round"></span>
						</div>
					</div>
				</div>
			</div>

			<!-- Right Column - Image -->
			<div class="col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-2">
						<img class="roi-image" id="img" src="" alt="ROI Image">
					</div>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="jquery-3.6.0.min.js?v=v1"></script>
	<script type="text/javascript" src="common.js?v=v1"></script>
	<script type="text/javascript" src="readconfigcommon.js?v=v1"></script>
	<script type="text/javascript" src="readconfigparam.js?v=v1"></script>

	<script type="text/javascript">
		function addZero(i) {
			if (i < 10) {
				i = "0" + i;
			}
			return i;
		}

		$(document).ready(function () {
			LoadData();
			LoadROIImage();
		});

		function LoadData() {
			loadValue("value", "value", "border-collapse: collapse; width: 100%");
			loadValue("raw", "raw", "border-collapse: collapse; width: 100%");
			loadValue("prevalue", "prevalue", "border-collapse: collapse; width: 100%");
			loadValue("error", "error", "border-collapse: collapse; width: 100%");
			loadStatus();
			loadSntpDate();
			loadCPUTemp();
			loadRSSI();
			loadUptime();
			loadRoundCounter();
		}

		function LoadROIImage() {
			var d = new Date();
			var timestamp = d.getTime();
			var h = addZero(d.getHours());
			var m = addZero(d.getMinutes());
			var s = addZero(d.getSeconds());
			document.getElementById("img").src = getDomainname() + '/img_tmp/alg_roi.jpg?timestamp=' + timestamp;
			$('#timestamp').html("Last Page Refresh:" + (h + ":" + m + ":" + s));
		}

		function Refresh() {
			setTimeout(function () {
				LoadData();
				LoadROIImage();
				Refresh();
			}, 300000);
		}

		function loadStatus() {
			url = domainname + '/statusflow';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#statusflow').html(_rsp);
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadCPUTemp() {
			url = domainname + '/cpu_temperature';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#cputemp').html("CPU Temperature: " + _rsp + "°C");
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadRSSI() {
			url = domainname + '/rssi';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;

					if (_rsp >= -55) {
						$('#rssi').html("WIFI Signal: Excellent (" + _rsp + "dBm)");
					}
					else if (_rsp < -55 && _rsp >= -67) {
						$('#rssi').html("WIFI Signal: Good (" + _rsp + "dBm)");
					}
					else if (_rsp < -67 && _rsp >= -78) {
						$('#rssi').html("WIFI Signal: Fair (" + _rsp + "dBm)");
					}
					else if (_rsp < -78 && _rsp >= -85) {
						$('#rssi').html("WIFI Signal: Weak (" + _rsp + "dBm)");
					}
					else {
						$('#rssi').html("WIFI Signal: Unreliable (" + _rsp + "dBm)");
					}
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadSntpDate() {
			url = domainname + '/date';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#sntp_date').html("Date/Time on device: " + _rsp);
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadUptime() {
			url = domainname + '/uptime';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#uptime').html("Uptime: " + _rsp);
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadRoundCounter() {
			url = domainname + '/info?type=Round';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#round').html("(Round: " + _rsp + ")");
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadValue(_type, _div, _style) {
			url = domainname + '/value?all=true&type=' + _type;
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					var _split = _rsp.split("\r");

					if (typeof _style == undefined) {
						out = "<table class='table table-sm table-bordered mb-0'>";
					}
					else {
						out = "<table class='table table-sm table-bordered mb-0' style=\"" + _style + "\">";
					}

					if (_split.length == 1) {
						var _zer = ZerlegeZeile(_split[0], "\t")

						if (_zer.length > 1) {
							out = _zer[1];
						}
						else {
							out = "";
						}
					}
					else {
						for (var j = 0; j < _split.length; ++j) {
							var _zer = ZerlegeZeile(_split[j], "\t")

							if (_zer.length == 1) {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle;\">" +
									_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle;\"> </td></tr>";
							}
							else {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle;\">" +
									_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle;\" >" + _zer[1] + "</td></tr>";
							}
						}
						out = out + "</table>"
					}
					document.getElementById(_div).innerHTML = out;
				}
			};

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		/* 
		function setImageMaxWidth() {
			loadConfig(domainname); 
			ParseConfig();
			param = getConfigParameters();
		    
			if(param["TakeImage"]["CamFrameSize"].value == "QVGA") {
				document.getElementById("img").style.maxWidth = "320px";
			}
			else {
				document.getElementById("img").style.maxWidth = "640px";
			}
		}
		*/
		function init() {
			domainname = getDomainname();
			// setImageMaxWidth(); // CamFrameSize was replaced by zoom - CamFrameSize is no longer needed/used for zoom 
			Refresh();
		}

		init();

	</script>

	<!-- Bootstrap Bundle JS -->
	<script src="bootstrap.bundle.min.js"></script>
</body>

</html>
