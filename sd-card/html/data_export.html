<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
    <title>Data Export (CSV)</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css" type="text/css">

    <script type="text/javascript" src="common.js?v=v1"></script>
    <script type="text/javascript" src="jszip.min.js?v=v1"></script>
    <script type="text/javascript" src="FileSaver.min.js?v=v1"></script>
</head>

<body>
    <div class="container-fluid py-4">
        <!-- Data Export Card -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Data Export (CSV)
                </h4>
            </div>
            <div class="card-body">
                <p class="card-text">
                    With the following action the <a href="/fileserver/log/data/" target="_self"
                        class="link-success">data</a>
                    folder on the SD-card gets zipped and provided as a download.
                </p>

                <button class="btn btn-success btn-lg" id="startExportData" type="button" onclick="startExportData()">
                    <i class="bi bi-download"></i> Export Data
                </button>

                <hr class="my-4">

                <!-- Progress Section -->
                <div id="progress"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="bootstrap.bundle.min.js"></script>

    <script type="text/javascript">
        function startExportData() {
            document.getElementById("progress").innerHTML = '<div class="alert alert-info"><strong>Status:</strong> Creating Export Data...<br>\n</div>';

            // Get hostname
            try {
                var xhttp = new XMLHttpRequest();
                xhttp.open("GET", getDomainname() + "/info?type=Hostname", false);
                xhttp.send();
                hostname = xhttp.responseText;
            }
            catch (err) {
                setStatus('<span class="text-danger"><strong>Error:</strong> Failed to fetch hostname: ' + err.message + '!</span>');
                return;
            }

            // get date/time
            var dateTime = new Date().toJSON().slice(0, 10) + "_" + new Date().toJSON().slice(11, 19).replaceAll(":", "-");

            zipFilename = hostname + "_" + dateTime + "_csv" + ".zip";
            console.log(zipFilename);

            // Get files list
            setStatus("Fetching File List...");
            try {
                var xhttp = new XMLHttpRequest();
                xhttp.open("GET", getDomainname() + "/fileserver/log/data/", false);
                xhttp.send();

                var parser = new DOMParser();
                var content = parser.parseFromString(xhttp.responseText, 'text/html');
            }
            catch (err) {
                setStatus("Failed to fetch files list: " + err.message);
                return;
            }

            const list = content.querySelectorAll("a");

            var urls = [];

            for (a of list) {
                url = a.getAttribute("href");
                urls.push(getDomainname() + url);
            }

            // Pack as zip and download
            try {
                startExportZip(urls, zipFilename);
            }
            catch (err) {
                setStatus('<span class="text-danger"><strong>Error:</strong> Failed to zip files: ' + err.message + '!</span>');
                return;
            }
        }

        function fetchFiles(urls, filesData, index, retry, zipFilename) {
            url = urls[index];

            if (retry == 0) {
                setStatus("&nbsp;- " + getFilenameFromUrl(urls[index]) + " (" + (index + 1) + "/" + urls.length + ")...");
            }
            else {
                setStatus('<span class="text-muted">&nbsp;&nbsp;&nbsp;Retrying (' + retry + ')...</span>');
            }

            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = "blob";

            if (retry == 0) { // Short timeout on first retry
                xhr.timeout = 2000; // time in milliseconds
            }
            else if (retry == 1) { // longer timeout
                xhr.timeout = 5000;
            }
            else if (retry == 2) { // longer timeout
                xhr.timeout = 10000;
            }
            else if (retry == 3) { // longer timeout
                xhr.timeout = 20000;
            }
            else { // very long timeout
                xhr.timeout = 30000;
            }

            xhr.onload = () => { // Request finished
                //console.log(url + " done");

                filesData[index] = xhr.response;

                if (index == urls.length - 1) {
                    setStatus("Fetched all files");
                    generateZipFile(urls, filesData, zipFilename);
                    return;
                }
                else { // Next file
                    fetchFiles(urls, filesData, index + 1, 0, zipFilename);
                }
            };

            xhr.onprogress = (e) => { // XMLHttpRequest progress ... extend timeout
                xhr.timeout = xhr.timeout + 500;
            };

            xhr.onerror = (e) => { // XMLHttpRequest error loading
                console.log("Error on fetching " + url + "!");
                if (retry > 5) {
                    setStatus('<span class="text-danger"><strong>Error:</strong> Data Export failed, please restart the device and try again!</span>');
                }
                else {
                    fetchFiles(urls, filesData, index, retry + 1, zipFilename);
                }
            };

            xhr.ontimeout = (e) => { // XMLHttpRequest timed out
                console.log("Timeout on fetching " + url + "!");
                if (retry > 5) {
                    setStatus('<span class="text-danger"><strong>Error:</strong> Data Export failed, please restart the device and try again!</span>');
                }
                else {
                    fetchFiles(urls, filesData, index, retry + 1, zipFilename);
                }
            };

            xhr.send(null);
        }

        function generateZipFile(urls, filesData, zipFilename) {
            setStatus("Creating Zip File...");

            var zip = new JSZip();

            for (var i = 0; i < urls.length; i++) {
                zip.file(getFilenameFromUrl(urls[i]), filesData[i]);
            }

            zip.generateAsync({ type: "blob" })
                .then(function (content) {
                    saveAs(content, zipFilename);
                });

            setStatus('<div class="alert alert-success mt-3"><strong>Success!</strong> Data Export completed successfully!</div>');
        }

        const startExportZip = (urls, zipFilename) => {
            if (!urls) { return; }

            console.log(urls);

            urlIndex = 0;
            setStatus("Fetching files...");
            fetchFiles(urls, [], 0, 0, zipFilename);
        };

        function setStatus(status) {
            console.log(status);
            document.getElementById("progress").innerHTML += status + "<br>\n";
        }

        function getFilenameFromUrl(url) {
            return filename = url.substring(url.lastIndexOf('/') + 1);
        }

    </script>
</body>

</html>
