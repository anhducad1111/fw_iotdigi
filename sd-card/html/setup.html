<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>
<title>AI on the edge</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="bootstrap.min.css" type="text/css">

<!-- Custom Edit Styles -->
<link rel="stylesheet" href="edit_style.css" type="text/css">

<script type="text/javascript">
    function resizeIframe(obj) {
        obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 20 + 'px';
    }
</script>
</head>

<body>
    <div class="container-fluid py-3" style="max-width: 1400px; margin: 0 auto;">
        <div class="row mb-3">
            <div class="col-auto">
                <img src="favicon.ico?v=v1" alt="Logo">
            </div>
            <div class="col">
                <h1>Digitizer - AI on the edge - Initial setup</h1>
                <h2>An ESP32 all inclusive neural network recognition system for meter Digitization</h2>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <div class="btn-group" role="group">
                    <button class="btn btn-secondary me-2" id="restart" name="restart" onclick="clickStart()">Restart Setup</button>
                    <button class="btn btn-secondary me-2" id="previous" name="previous" onclick="clickPrevious()">Previous Step</button>
                    <button class="btn btn-primary me-2" id="next" name="next" onclick="clickNext()">Next Step</button>
                    <button class="btn btn-danger" id="skip" name="skip" onclick="clickAbort()">Abort Setup</button>
                </div>
            </div>
            <div class="col-md-3">
                <label>Setup Progress:</label>
                <div class="progress">
                    <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="7"></div>
                </div>
            </div>
            <div class="col-md-3 text-end">
                <output id="rssi" name="rssi"></output>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="h_iframe_explain mb-3" id="h_iframe_explain" style="display: none;">
                    <iframe name="explaincontent" id="explaincontent" src="" allowfullscreen style="width: 100%; height: 155px; border: none;"></iframe>
                </div>

                <div class="h_iframe" id="h_iframe">
                    <iframe name="maincontent" id="maincontent" src="" onload="resizeIframe(this)" allowfullscreen style="width: 100%; height: 800px; border: none;"></iframe>
                    <iframe name="stream" id="stream" src="" style="display: none;" allowfullscreen style="width: 100%; height: 800px; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

<script type="text/javascript" src="common.js?v=v1"></script>
<script type="text/javascript">
    var aktstep = 0;
    var setupCompleted = false;
    document.getElementById('stream').style.display = "none";   // Make sure that stream iframe is always hidden
    document.getElementById("progressBar").style.width = "0%";
    document.getElementById("progressBar").setAttribute("aria-valuenow", 0);

    function clickStart() {
        aktstep = 0;
        setupCompleted = false;
        document.getElementById('stream').src = "";
        document.getElementById('stream').style.display = "none";   // Make sure that stream iframe is always hidden
        LoadStep();
    }

    function clickAbort() {
        setupCompleted = false;
        aktstep = 7;
        document.getElementById('stream').src = "";
        document.getElementById('stream').style.display = "none";   // Make sure that stream iframe is always hidden
        LoadStep();
    }

   function clickNext() {
        aktstep++;
        if (aktstep > 7) {
            aktstep = 7;
        }
        document.getElementById('stream').src = "";
        document.getElementById('stream').style.display = "none";   // Make sure that stream iframe is always hidden
        LoadStep();
    }

   function clickPrevious() {
        aktstep--;
        if (aktstep < 0) {
            aktstep = 0;
        }
        document.getElementById('stream').src = "";
        document.getElementById('stream').style.display = "none";   // Make sure that stream iframe is always hidden
        LoadStep();
   }

   function LoadStep(){
      loadRSSI();
      switch (aktstep) {
        case 0: // Start page
            document.getElementById('maincontent').src = 'edit_explain_0.html?v=v1';
            document.getElementById('maincontent').style.display = "";

            document.getElementById('h_iframe_explain').style.display = "none";

            document.getElementById("restart").disabled = true;
            document.getElementById("previous").disabled = true;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById("progressBar").style.width = "0%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 0);
            setupCompleted = false;
            break;

        case 1: // Live stream
            document.getElementById('maincontent').style.display = "none";

            document.getElementById('h_iframe_explain').style.display = "";
            document.getElementById('h_iframe_explain').style.height = "155px";
            document.getElementById('explaincontent').style.height = "155px";
            document.getElementById('explaincontent').scrolling = "yes";
            document.getElementById('explaincontent').src = 'explain_1.html?v=v1';

            document.getElementById("restart").disabled = false;
            document.getElementById("previous").disabled = false;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById('h_iframe').style.height = "480px";
            document.getElementById('stream').style.height = "480px";

            document.getElementById("progressBar").style.width = "14%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 1);
            setupCompleted = false;
            setTimeout(function() {
                document.getElementById('stream').src = getDomainname() + '/stream?flashlight=true';   // needs to be the last statement because it's kind of blocking
                document.getElementById('stream').style.display = "";
            }, 500);
            break;

        case 2: // Reference image
            document.getElementById('maincontent').src = 'edit_reference.html?v=v1#description';
            document.getElementById('maincontent').style.display = "";

            document.getElementById('h_iframe_explain').style.display = "";
            document.getElementById('h_iframe_explain').style.height = "45px";
            document.getElementById('explaincontent').style.height = "45px";
            document.getElementById('explaincontent').scrolling = "no";
            document.getElementById('explaincontent').src = 'explain_2.html?v=v1';

            document.getElementById("restart").disabled = false;
            document.getElementById("previous").disabled = false;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById("progressBar").style.width = "29%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 2);
            setupCompleted = false;
            break;

        case 3: // Alignment marker
            document.getElementById('maincontent').src = 'edit_alignment.html?v=v1#description';

            document.getElementById('h_iframe_explain').style.display = "";
            document.getElementById('h_iframe_explain').style.height = "45px";
            document.getElementById('explaincontent').style.height = "45px";
            document.getElementById('explaincontent').scrolling = "no";
            document.getElementById('explaincontent').src = 'explain_3.html?v=v1';

            document.getElementById("restart").disabled = false;
            document.getElementById("previous").disabled = false;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById("progressBar").style.width = "43%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 3);
            setupCompleted = false;
            break;

        case 4: // Digit ROIs
            document.getElementById('maincontent').src = 'edit_digits.html?v=v1#description';

            document.getElementById('h_iframe_explain').style.display = "";
            document.getElementById('h_iframe_explain').style.height = "45px";
            document.getElementById('explaincontent').style.height = "45px";
            document.getElementById('explaincontent').scrolling = "no";
            document.getElementById('explaincontent').src = 'explain_4.html?v=v1';

            document.getElementById("restart").disabled = false;
            document.getElementById("previous").disabled = false;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById("progressBar").style.width = "57%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 4);
            setupCompleted = false;
            break;

        case 5: // Analog ROIs
            document.getElementById('maincontent').src = 'edit_analog.html?v=v1#description';

            document.getElementById('h_iframe_explain').style.display = "";
            document.getElementById('h_iframe_explain').style.height = "45px";
            document.getElementById('explaincontent').style.height = "45px";
            document.getElementById('explaincontent').scrolling = "no";
            document.getElementById('explaincontent').src = 'explain_5.html?v=v1';

            document.getElementById("restart").disabled = false;
            document.getElementById("previous").disabled = false;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById("progressBar").style.width = "71%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 5);
            setupCompleted = false;
            break;

        case 6: // Config page
            document.getElementById('maincontent').src = 'edit_config.html?v=v1#description';

            document.getElementById('h_iframe_explain').style.display = "";
            document.getElementById('h_iframe_explain').style.height = "100px";
            document.getElementById('explaincontent').style.height = "100px";
            document.getElementById('explaincontent').scrolling = "no";
            document.getElementById('explaincontent').src = 'explain_6.html?v=v1';

            document.getElementById("restart").disabled = false;
            document.getElementById("previous").disabled = false;
            document.getElementById("next").disabled = false;
            document.getElementById("skip").disabled = false;

            document.getElementById("progressBar").style.width = "86%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 6);
            setupCompleted = true;
            break;

        case 7: // Setup completed / aborted
            document.getElementById('h_iframe').style.height = "660px";
            document.getElementById('maincontent').style.height = "660px";
            if (setupCompleted) {
                document.getElementById('maincontent').src = 'edit_explain_7.html?v=v1';
            }
            else {
                document.getElementById('maincontent').src = 'edit_explain_7_abort.html?v=v1';
                document.getElementById("previous").disabled = true;
            }

            document.getElementById('h_iframe_explain').style.display = "none";

            document.getElementById("skip").disabled = true;
            document.getElementById("restart").disabled = false;
            document.getElementById("next").disabled = true;

            document.getElementById("progressBar").style.width = "100%";
            document.getElementById("progressBar").setAttribute("aria-valuenow", 7);
            break;
        }
   }

   function loadRSSI() {
		url = getDomainname() + '/rssi';
		var xhttp = new XMLHttpRequest();
		xhttp.onreadystatechange = function() {
			if (this.readyState == 4 && this.status == 200) {
				var _rsp = xhttp.responseText;

				if (_rsp >= -55) {
					document.getElementById('rssi').value = ("WIFI Signal: Excellent (" + _rsp + "dBm)");
				}
				else if (_rsp < -55 && _rsp >= -67) {
					document.getElementById('rssi').value = ("WIFI Signal: Good (" + _rsp + "dBm)");
				}
				else if (_rsp < -67 && _rsp >= -78) {
					document.getElementById('rssi').value = ("WIFI Signal: Fair (" + _rsp + "dBm)");
				}
				else if (_rsp < -78 && _rsp >= -85) {
					document.getElementById('rssi').value = ("WIFI Signal: Weak (" + _rsp + "dBm)");
				}
				else {
					document.getElementById('rssi').value = ("WIFI Signal: Unreliable (" + _rsp + "dBm)");
				}
			}
		}
		xhttp.open("GET", url, true);
		xhttp.send();
	}


   LoadStep();

</script>

<!-- Bootstrap Bundle JS -->
<script src="bootstrap.bundle.min.js"></script>
</body>
</html>
