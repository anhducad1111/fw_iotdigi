<!DOCTYPE html>
<html lang="en" xml:lang="en"> 
<head>
    <title>AI on the edge</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css" type="text/css">
    
    <style>
        body, html {
            width: 100%; 
            height: 100%; 
            min-height: 800px;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .header-logo {
            width: 60px;
            height: auto;
        }

        .main-iframe {
            width: 100%;
            height: 800px;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }

        .stream-iframe {
            width: 100%;
            height: 480px;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wifi-signal {
            font-size: 0.9rem;
            padding: 0. 5rem;
            background-color: #f8f9fa;
            border-radius: 0.25rem;
            border: 1px solid #dee2e6;
        }

        .btn-custom {
            min-width: 125px;
        }

        .iframe-container {
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container py-3">
        <!-- Header Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center">
                    <img src="favicon.ico? v=v1" alt="Logo" class="header-logo me-3">
                    <div>
                        <h1 class="mb-2">Digitizer - AI on the edge - Initial setup</h1>
                        <h2 class="h5 text-muted mb-0">An ESP32 all inclusive neural network recognition system for meter Digitization</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Panel Section -->
        <div class="row mb-3">
            <div class="col-lg-6 col-md-12 mb-3 mb-lg-0">
                <div class="btn-group" role="group" aria-label="Setup controls">
                    <button class="btn btn-primary btn-custom" 
                            id="restart" 
                            name="restart" 
                            onclick="clickStart()">
                        Restart Setup
                    </button>
                    <button class="btn btn-secondary btn-custom" 
                            id="previous" 
                            name="previous" 
                            onclick="clickPrevious()">
                        Previous Step
                    </button>
                    <button class="btn btn-success btn-custom" 
                            id="next" 
                            name="next" 
                            onclick="clickNext()">
                        Next Step
                    </button>
                    <button class="btn btn-danger btn-custom" 
                            id="skip" 
                            name="skip" 
                            onclick="clickAbort()">
                        Abort Setup
                    </button>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
                <div class="progress-container">
                    <label class="form-label mb-0 me-2">Setup Progress: </label>
                    <progress id="progressBar" 
                              class="form-control-sm" 
                              value="0" 
                              max="7" 
                              style="width: 120px;">
                    </progress>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="wifi-signal text-end">
                    <output id="rssi" name="rssi">Loading WiFi signal...</output>
                </div>
            </div>
        </div>

        <!-- Main Content Section -->
        <div class="row">
            <div class="col-12">
                <div class="iframe-container">
                    <!-- Main Content Iframe -->
                    <iframe name="maincontent" 
                            id="maincontent" 
                            src="" 
                            onload="resizeIframe(this)" 
                            allowfullscreen 
                            class="main-iframe">
                    </iframe>

                    <!-- Stream Iframe (Hidden by default) -->
                    <iframe name="stream" 
                            id="stream" 
                            src="" 
                            allowfullscreen 
                            class="stream-iframe" 
                            style="display: none;">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="bootstrap.bundle.min.js"></script>
    
    <!-- Common JS -->
    <script type="text/javascript" src="common.js? v=v1"></script>
    
    <!-- Main Application Script -->
    <script type="text/javascript">
        var aktstep = 0;
        var setupCompleted = false;
        
        // Initialize
        document.getElementById('stream').style.display = "none";
        document.getElementById("progressBar").value = 0;

        function resizeIframe(obj) {
            obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 20 + 'px';
        }

        function clickStart() {
            aktstep = 0;
            setupCompleted = false;
            document.getElementById('stream').src = "";     
            document.getElementById('stream').style.display = "none";
            LoadStep();
        }

        function clickAbort() {
            setupCompleted = false;
            aktstep = 7;
            document.getElementById('stream').src = "";     
            document.getElementById('stream').style.display = "none";
            LoadStep();
        }

        function clickNext() {
            aktstep++;
            if (aktstep > 7) {
                aktstep = 7;
            }
            document. getElementById('stream').src = "";     
            document.getElementById('stream').style.display = "none";
            LoadStep();
        }

        function clickPrevious() {
            aktstep--;
            if (aktstep < 0) {
                aktstep = 0;
            }
            document.getElementById('stream').src = "";     
            document.getElementById('stream').style.display = "none";
            LoadStep();
        }

        function LoadStep() {
            loadRSSI();
            
            // Hide all iframes first
            document.getElementById('maincontent').style.display = "none";
            document.getElementById('stream').style.display = "none";
            
            switch (aktstep) {
                case 0: // Start page
                    document.getElementById('maincontent').src = 'edit_explain_0.html? v=v1';
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document.getElementById("restart").disabled = true;
                    document.getElementById("previous").disabled = true;
                    document. getElementById("next").disabled = false;
                    document.getElementById("skip").disabled = false;

                    document.getElementById("progressBar").value = 0;
                    setupCompleted = false;
                    break;

                case 1: // Live stream
                    document.getElementById("restart").disabled = false;
                    document.getElementById("previous").disabled = false;
                    document.getElementById("next").disabled = false;
                    document.getElementById("skip").disabled = false;

                    document.getElementById("progressBar").value = 1;
                    setupCompleted = false;

                    setTimeout(function() {
                        document. getElementById('stream').src = getDomainname() + '/stream?flashlight=true';
                        document. getElementById('stream').style.display = "";
                    }, 500);
                    break;

                case 2: // Reference image
                    document.getElementById('maincontent').src = 'edit_reference.html?v=v1#description';
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document.getElementById("restart").disabled = false;
                    document.getElementById("previous").disabled = false;
                    document.getElementById("next").disabled = false;
                    document.getElementById("skip").disabled = false;

                    document. getElementById("progressBar").value = 2;
                    setupCompleted = false;
                    break;

                case 3: // Alignment marker
                    document.getElementById('maincontent').src = 'edit_alignment.html?v=v1#description';
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document.getElementById("restart").disabled = false;
                    document.getElementById("previous").disabled = false;
                    document.getElementById("next").disabled = false;
                    document.getElementById("skip").disabled = false;

                    document.getElementById("progressBar").value = 3;
                    setupCompleted = false;
                    break;

                case 4: // Digit ROIs
                    document.getElementById('maincontent').src = 'edit_digits.html?v=v1#description';
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document.getElementById("restart").disabled = false;
                    document.getElementById("previous").disabled = false;
                    document.getElementById("next").disabled = false;
                    document. getElementById("skip").disabled = false;

                    document.getElementById("progressBar").value = 4;
                    setupCompleted = false;
                    break;

                case 5: // Analog ROIs
                    document.getElementById('maincontent').src = 'edit_analog.html?v=v1#description';
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document.getElementById("restart").disabled = false;
                    document. getElementById("previous").disabled = false;
                    document.getElementById("next").disabled = false;
                    document.getElementById("skip").disabled = false;

                    document.getElementById("progressBar").value = 5;
                    setupCompleted = false;
                    break;

                case 6: // Config page
                    document.getElementById('maincontent').src = 'edit_config.html?v=v1#description';
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document.getElementById("restart").disabled = false;
                    document.getElementById("previous").disabled = false;
                    document.getElementById("next").disabled = false;
                    document.getElementById("skip").disabled = false;

                    document. getElementById("progressBar").value = 6;
                    setupCompleted = true;
                    break; 

                case 7: // Setup completed / aborted
                    if (setupCompleted) {
                        document.getElementById('maincontent').src = 'edit_explain_7.html?v=v1';
                    } else {
                        document. getElementById('maincontent').src = 'edit_explain_7_abort.html?v=v1';
                        document.getElementById("previous").disabled = true; 
                    }
                    
                    document.getElementById('maincontent').style.display = "";
                    document.getElementById('maincontent').className = "main-iframe";

                    document. getElementById("skip").disabled = true;
                    document.getElementById("restart").disabled = false;
                    document.getElementById("next").disabled = true;

                    document.getElementById("progressBar").value = 7;
                    break;
            }
        }

        function loadRSSI() {
            url = getDomainname() + '/rssi';     
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    var _rsp = xhttp.responseText;
                    
                    if (_rsp >= -55) {
                        document.getElementById('rssi').value = ("WIFI Signal:  Excellent (" + _rsp + "dBm)");
                    } else if (_rsp < -55 && _rsp >= -67) {
                        document.getElementById('rssi').value = ("WIFI Signal: Good (" + _rsp + "dBm)");
                    } else if (_rsp < -67 && _rsp >= -78) {
                        document.getElementById('rssi').value = ("WIFI Signal: Fair (" + _rsp + "dBm)");
                    } else if (_rsp < -78 && _rsp >= -85) {
                        document.getElementById('rssi').value = ("WIFI Signal:  Weak (" + _rsp + "dBm)");
                    } else {
                        document.getElementById('rssi').value = ("WIFI Signal:  Unreliable (" + _rsp + "dBm)");
                    }
                }
            }
            xhttp.open("GET", url, true);
            xhttp.send();		
        }

        // Initialize on load
        LoadStep();
    </script>
</body>
</html>
