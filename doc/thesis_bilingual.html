<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Script - Vietnamese & English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        .panel {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            scroll-behavior: smooth;
        }
        
        .panel:first-child {
            border-right: 2px solid #ddd;
            background: #fafafa;
        }
        
        .panel:last-child {
            background: #f5f5f5;
        }
        
        .panel::-webkit-scrollbar {
            width: 10px;
        }
        
        .panel::-webkit-scrollbar-track {
            background: #e0e0e0;
        }
        
        .panel::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 5px;
        }
        
        .panel::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* Markdown styling */
        h1 { font-size: 24px; margin-bottom: 20px; color: #222; }
        h2 { font-size: 20px; margin-top: 30px; margin-bottom: 15px; color: #333; }
        h3 { font-size: 16px; margin-top: 20px; margin-bottom: 10px; color: #444; }
        p { line-height: 1.8; margin-bottom: 15px; color: #333; }
        strong { color: #000; }
        ul, ol { margin-left: 30px; margin-bottom: 15px; }
        li { margin-bottom: 8px; line-height: 1.6; }
        hr { border: none; border-top: 1px solid #ccc; margin: 30px 0; }
        code { background: #e8e8e8; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel" id="vi-content">Loading...</div>
        <div class="panel" id="en-content">Loading...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        marked.setOptions({ breaks: true, gfm: true });

        async function loadContent() {
            try {
                const [viRes, enRes] = await Promise.all([
                    fetch('./thesis_script_vi.md'),
                    fetch('./thesis_script_en.md')
                ]);
                
                const viContent = await viRes.text();
                const enContent = await enRes.text();
                
                document.getElementById('vi-content').innerHTML = marked.parse(viContent);
                document.getElementById('en-content').innerHTML = marked.parse(enContent);
                
                setupScrollSync();
            } catch (error) {
                document.getElementById('vi-content').innerHTML = '<p style="color:red">Error: Run "python -m http.server 8000" in doc folder</p>';
                document.getElementById('en-content').innerHTML = '<p style="color:red">Error: Run "python -m http.server 8000" in doc folder</p>';
            }
        }

        function setupScrollSync() {
            const viPanel = document.getElementById('vi-content');
            const enPanel = document.getElementById('en-content');
            let isSyncing = false;
            
            viPanel.addEventListener('scroll', () => {
                if (isSyncing) return;
                isSyncing = true;
                
                const scrollPercent = viPanel.scrollTop / (viPanel.scrollHeight - viPanel.clientHeight);
                enPanel.scrollTop = scrollPercent * (enPanel.scrollHeight - enPanel.clientHeight);
                
                requestAnimationFrame(() => {
                    isSyncing = false;
                });
            });
            
            enPanel.addEventListener('scroll', () => {
                if (isSyncing) return;
                isSyncing = true;
                
                const scrollPercent = enPanel.scrollTop / (enPanel.scrollHeight - enPanel.clientHeight);
                viPanel.scrollTop = scrollPercent * (viPanel.scrollHeight - viPanel.clientHeight);
                
                requestAnimationFrame(() => {
                    isSyncing = false;
                });
            });
        }

        window.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
</body>
</html>
